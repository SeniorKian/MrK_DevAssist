# Dependency update PRs only; nothing is auto-merged. Every update must pass CI
# and human review like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /apps/control-plane
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # Runtime pins shared by the image and CI (deploy/images/requirements.txt).
  - package-ecosystem: pip
    directory: /deploy/images
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # setuptools 82+ drops pkg_resources, which devpi (via pyramid) still imports;
      # devpi does not even start with it. Lift once devpi no longer needs it.
      - dependency-name: setuptools
        versions: [">=82"]

  - package-ecosystem: npm
    directory: /apps/admin-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /deploy/verdaccio
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # Base image digests. scripts/validate_release.py fails if the node/python
  # digests used by workflow `docker run` steps drift from the Dockerfile's, so
  # update those in the same PR.
  - package-ecosystem: docker
    directory: /deploy/images
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Python minor upgrades are a runtime change (CI, venvs and pinned wheels
      # such as devpi/awscrt all target 3.13); do them by hand, not by bot.
      # Digest updates of the 3.13 image still come through.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
