name: Scheduled soak test

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Bounded soak duration in seconds (60-3600)
        required: false
        default: "600"
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOAK_DURATION: ${{ inputs.duration_seconds || '600' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/images/Dockerfile
          target: panel
          push: false
          load: true
          tags: mrk-panel:soak
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=soak
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker volume create mrk-soak-data
      - run: docker network create mrk-soak-network
      - name: Prepare data volume with minimum bootstrap capability
        run: >-
          docker run --rm --read-only
          --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE
          --security-opt no-new-privileges:true
          --mount source=mrk-soak-data,target=/data
          --entrypoint python mrk-panel:soak
          /opt/mrk/entrypoint.py --prepare-only
      - name: Start hardened panel
        run: >-
          docker run --detach --name mrk-soak --network mrk-soak-network
          --user 10001:10001
          --env MRK_TRUSTED_HOSTS=mrk-soak,127.0.0.1,localhost
          --env MRK_LOG_LEVEL=WARNING
          --read-only --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev
          --cap-drop ALL --security-opt no-new-privileges:true
          --mount source=mrk-soak-data,target=/data mrk-panel:soak
      - name: Wait for readiness
        run: >-
          docker exec --env MRK_HEALTHCHECK_ATTEMPTS=30 mrk-soak
          python -m mrk_control_plane.healthcheck
      - name: Run bounded keep-alive soak
        run: >-
          docker run --rm --network mrk-soak-network
          --mount type=bind,source=${{ github.workspace }}/scripts/load_probe.py,target=/load_probe.py,readonly
          python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          python /load_probe.py --url http://mrk-soak:8080/health/live
          --duration "$SOAK_DURATION" --concurrency 16
          --max-error-rate 0.001 --max-p95-ms 500
      - name: Verify readiness after soak
        run: >-
          docker exec --env MRK_HEALTHCHECK_ATTEMPTS=3 mrk-soak
          python -m mrk_control_plane.healthcheck
      - if: always()
        continue-on-error: true
        run: docker logs mrk-soak
      - if: always()
        continue-on-error: true
        run: docker rm --force mrk-soak
      - if: always()
        continue-on-error: true
        run: docker network rm mrk-soak-network
      - if: always()
        continue-on-error: true
        run: docker volume rm mrk-soak-data

  # docs/41 §4: optional 10-minute load test of the DNS engine alone (manual
  # runs only): the engine serves cache hits and locally answered names under
  # a sustained mrk-dnsbench load and must stay healthy afterwards.
  dns-engine-load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: golang:1.27.3-trixie@sha256:af1bfc2614ebb1dbd31af514b78740fd678850e76498762b425ecee4c5c6ea80
    defaults:
      run:
        working-directory: apps/dns-engine
    env:
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: local
      SOAK_DURATION: ${{ inputs.duration_seconds || '600' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the engine and the load generator
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/mrk-dns ./cmd/mrk-dns
          CGO_ENABLED=0 go build -trimpath -o /tmp/mrk-dnsbench ./cmd/mrk-dnsbench
      - name: Start the engine
        run: |
          mkdir -p /tmp/dns-data /tmp/dns-run
          chown -R 10001:10001 /tmp/dns-data /tmp/dns-run
          MRK_DNS_DATA_DIR=/tmp/dns-data MRK_DNS_ADMIN_SOCKET=/tmp/dns-run/admin.sock \
            MRK_DNS_LISTEN=127.0.0.1:5353 MRK_DNS_GOMEMLIMIT=256MiB nohup /tmp/mrk-dns serve > /tmp/mrk-dns.log 2>&1 &
          for i in $(seq 1 30); do
            MRK_DNS_ADMIN_SOCKET=/tmp/dns-run/admin.sock /tmp/mrk-dns health && exit 0
            sleep 1
          done
          cat /tmp/mrk-dns.log
          exit 1
      - name: Sustained load
        run: >-
          /tmp/mrk-dnsbench -server 127.0.0.1:5353 -c 16 -window 16 -d "${SOAK_DURATION}s"
          -names example.com,example.org,localhost,mrk-health.invalid -json | tee /tmp/bench.json
      - name: Engine still healthy
        run: MRK_DNS_ADMIN_SOCKET=/tmp/dns-run/admin.sock /tmp/mrk-dns health
      - if: always()
        continue-on-error: true
        run: tail -n 200 /tmp/mrk-dns.log
