name: Publish container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/pyproject.toml
      - run: python -m pip install -e "./apps/control-plane[dev]"
      - run: >-
          python -m pip install supervisor==4.3.0 setuptools==80.9.0
          devpi-server==6.21.0 devpi-web==5.2.0 devpi-client==7.3.0
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ./apps/control-plane
      - run: python -m ruff check apps/control-plane scripts
      - run: python -m pytest
      - run: python scripts/rehearse_migrations.py
      - run: python scripts/validate_release.py
      - name: Review runtime dependency licenses
        run: python scripts/check_licenses.py --output build/license-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-dependency-license-report
          path: build/license-report.json
          if-no-files-found: error

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/admin-ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/admin-ui
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: apps/admin-ui
      - run: npm run build
        working-directory: apps/admin-ui
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/verdaccio
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: deploy/verdaccio
      - run: ./node_modules/.bin/verdaccio --version
        working-directory: deploy/verdaccio
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/pglite
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: deploy/pglite
      - run: ./node_modules/.bin/pglite-server --help
        working-directory: deploy/pglite

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrk-package-mirror" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/appliance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan published digest for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Publish digest
        run: echo "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
