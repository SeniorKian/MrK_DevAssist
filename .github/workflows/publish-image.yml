name: Publish container image

on:
  push:
    tags: ["v*"]
  # Manual runs must be dispatched against a v* tag ref; branch refs are refused
  # by the job-level `if:` guards below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Runs untrusted-by-default build tooling (pip, npm, pytest, repo scripts),
    # so it only ever gets a read-only token.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: devassist
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: devassist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devassist -d devassist"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/pyproject.toml
      - run: python -m pip install -e "./apps/control-plane[dev]"
      - run: python -m pip install -r deploy/images/requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ./apps/control-plane
      - run: python -m ruff check apps/control-plane scripts
      - name: The tag is the version recorded in VERSION (and every file agrees)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py --check
          test "v$(cat VERSION | tr -d '[:space:]')" = "$TAG" || {
            echo "tag $TAG does not match VERSION $(cat VERSION)" >&2; exit 1; }
      - run: python -m pytest
      - run: python scripts/rehearse_migrations.py
      - run: python scripts/validate_release.py
      - name: Reject npm lockfile URLs from unapproved hosts
        env:
          NPM_LOCKFILE_ALLOWED_HOSTS: registry.npmjs.org,mirror-npm.rasadyar.net
        run: python scripts/check_lockfile_hosts.py
      - name: Review runtime dependency licenses
        run: python scripts/check_licenses.py --output build/license-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dependency-license-report
          path: build/license-report.json
          if-no-files-found: error

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/admin-ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/admin-ui
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: apps/admin-ui
      - run: npm run build
        working-directory: apps/admin-ui
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/verdaccio
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: deploy/verdaccio
      - run: ./node_modules/.bin/verdaccio --version
        working-directory: deploy/verdaccio

      # Same database and engine gates as CI, so a tag on a commit that never
      # passed CI cannot skip them.
      - name: Smoke test auth, tasks, backup and restore on PostgreSQL
        env:
          MRK_SMOKE_DATABASE_URL: postgresql+psycopg://devassist:ci-only-password@127.0.0.1:5432/devassist?sslmode=disable
        run: python scripts/smoke_database.py
      - name: Fresh database for the migration rehearsal
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U devassist -d devassist -c "CREATE DATABASE rehearsal"
      - name: Rehearse migrations against PostgreSQL
        run: >-
          python scripts/rehearse_migrations.py --database-url
          "postgresql+psycopg://devassist:ci-only-password@127.0.0.1:5432/rehearsal?sslmode=disable"
      - name: Exercise real npm and PyPI engines across restart and offline download
        run: python scripts/e2e_local_engines.py

  # docs/44: the split images the panel's add-service wizard points at
  # (ghcr.io/<owner>/mrk-<target>). The panel records the release version in
  # MRK_IMAGE_TAG, so the wizard always offers service images of the same release.
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [panel, agent, firewall, dns, s3, npm, pypi]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Normalize image name and version
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrk-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      # Push by digest only: tags are applied after the vulnerability scan passes.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: deploy/images/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            SOURCE_URL=https://github.com/${{ github.repository }}
            IMAGE_TAG=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=split-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=split-${{ matrix.target }}
          provenance: mode=max
          sbom: true

      - name: Scan pushed digest (linux/amd64) for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Apply release tags to the scanned digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          {
            echo "$IMAGE@$DIGEST"
            while IFS= read -r tag; do [[ -n "$tag" ]] && echo "- $tag"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release (its page is the "release notes" link of the panel's
  # update page). Created only after every image is published and scanned.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Create the release with the changelog section as notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py --notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrk-<name>:${TAG#v}\`"
            echo "(panel, agent, firewall, dns, s3, npm, pypi). Update from the panel:"
            echo "My services -> Versions & updates."
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "MrK DevAssist ${TAG#v}"             --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
