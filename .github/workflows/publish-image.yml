name: Publish container image

on:
  push:
    tags: ["v*"]
  # Manual runs must be dispatched against a v* tag ref; branch refs are refused
  # by the job-level `if:` guards below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Runs untrusted-by-default build tooling (pip, npm, pytest, repo scripts),
    # so it only ever gets a read-only token.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/pyproject.toml
      - run: python -m pip install -e "./apps/control-plane[dev]"
      - run: python -m pip install -r deploy/appliance/requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ./apps/control-plane
      - run: python -m ruff check apps/control-plane scripts
      - run: python -m pytest
      - run: python scripts/rehearse_migrations.py
      - run: python scripts/validate_release.py
      - name: Reject npm lockfile URLs from unapproved hosts
        env:
          NPM_LOCKFILE_ALLOWED_HOSTS: registry.npmjs.org,mirror-npm.rasadyar.net
        run: python scripts/check_lockfile_hosts.py
      - name: Review runtime dependency licenses
        run: python scripts/check_licenses.py --output build/license-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dependency-license-report
          path: build/license-report.json
          if-no-files-found: error

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/admin-ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/admin-ui
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: apps/admin-ui
      - run: npm run build
        working-directory: apps/admin-ui
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/verdaccio
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: deploy/verdaccio
      - run: ./node_modules/.bin/verdaccio --version
        working-directory: deploy/verdaccio
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/pglite
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: deploy/pglite
      - run: ./node_modules/.bin/pglite-server --help
        working-directory: deploy/pglite

      # Same database and engine gates as CI, so a tag on a commit that never
      # passed CI cannot skip them.
      - name: Start PGlite for the smoke test
        run: bash scripts/ci_pglite_server.sh start "$RUNNER_TEMP/pglite/smoke"
      - name: Smoke test auth, tasks, backup and restore on PGlite
        env:
          MRK_SMOKE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable
        run: python scripts/smoke_pglite.py
      - name: Stop PGlite after the smoke test
        if: always()
        continue-on-error: true
        run: bash scripts/ci_pglite_server.sh stop "$RUNNER_TEMP/pglite/smoke"
      - name: Start a fresh PGlite for the migration rehearsal
        run: bash scripts/ci_pglite_server.sh start "$RUNNER_TEMP/pglite/rehearsal"
      - name: Rehearse migrations against PGlite
        run: >-
          python scripts/rehearse_migrations.py --database-url
          "postgresql+psycopg://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable"
      - name: Stop PGlite after the migration rehearsal
        if: always()
        continue-on-error: true
        run: bash scripts/ci_pglite_server.sh stop "$RUNNER_TEMP/pglite/rehearsal"
      - name: Exercise real npm and PyPI engines across restart and offline download
        run: python scripts/e2e_local_engines.py

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrk-devassist" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Run the appliance before anything is pushed: an amd64 build from the same
      # source and cache, started read-only and probed like the CI image gate.
      - name: Build amd64 image for the release smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/appliance/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mrk/package-mirror:release-smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker network create mrk-release
      - run: docker volume create mrk-release-data
      - name: Start the release candidate container
        run: >-
          docker run --detach --name mrk-release --network mrk-release --read-only
          --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true
          --env MRK_TRUSTED_HOSTS=mrk-release,127.0.0.1,localhost
          --env MRK_LOG_LEVEL=WARNING
          --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev
          --mount source=mrk-release-data,target=/data
          mrk/package-mirror:release-smoke
      - name: Wait for release candidate readiness
        run: >-
          docker exec --env MRK_HEALTHCHECK_ATTEMPTS=60 mrk-release
          python -m mrk_control_plane.healthcheck
      - name: Fetch an npm package through the release candidate
        run: >-
          docker run --rm --network mrk-release
          node:24.18.0-trixie-slim@sha256:ae91dcc111a68c9d2d81ff2a17bda61be126426176fde6fe7d08ab13b7f50573
          npm pack is-number@7.0.0 --registry http://mrk-release:4873
      - name: Fetch a PyPI package through the release candidate
        run: >-
          docker run --rm --network mrk-release
          python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          python -m pip download --no-deps --dest /tmp/pypi-release
          --index-url http://mrk-release:3141/root/pypi/+simple/
          --trusted-host mrk-release sampleproject==4.0.0

      - name: Release candidate logs
        if: always()
        continue-on-error: true
        run: docker logs mrk-release

      - name: Remove the release candidate container
        if: always()
        continue-on-error: true
        run: |
          docker rm --force mrk-release || true
          docker network rm mrk-release || true
          docker volume rm mrk-release-data || true

      # Push by digest only: no tag points at the image until it has passed the
      # vulnerability scan below, so a failing scan leaves only an untagged digest.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: deploy/appliance/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan pushed digest (linux/amd64) for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan pushed digest (linux/arm64) for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Apply release tags to the scanned digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(--tag "$tag")
          done <<< "$TAGS"
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "metadata-action produced no tags" >&2
            exit 1
          fi
          # A single index source without --annotation keeps the digest, so the tags
          # point at exactly the scanned and attested image. Verify that below.
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tagged="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ "$tagged" != "$DIGEST" ]]; then
              echo "tag $tag points at $tagged, expected $DIGEST" >&2
              exit 1
            fi
          done <<< "$TAGS"

      - name: Publish digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          {
            echo "$IMAGE@$DIGEST"
            echo
            echo "Tags:"
            while IFS= read -r tag; do [[ -n "$tag" ]] && echo "- $tag"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
