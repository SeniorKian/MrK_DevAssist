name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  # Hosts permitted in npm lockfile "resolved" URLs (comma-separated).
  # mirror-npm.rasadyar.net is the owner's intentional regional npm mirror.
  NPM_LOCKFILE_ALLOWED_HOSTS: registry.npmjs.org,mirror-npm.rasadyar.net

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/pyproject.toml
      - run: python -m pip install -e "./apps/control-plane[dev]"
      - run: python -m pip install -r deploy/appliance/requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ./apps/control-plane
      - run: python -m ruff check apps/control-plane scripts
      - run: python -m pytest
      - run: python scripts/rehearse_migrations.py
      - run: python scripts/validate_release.py
      - name: Review runtime dependency licenses
        run: python scripts/check_licenses.py --output build/license-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-license-report
          path: build/license-report.json
          if-no-files-found: error

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/admin-ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Check Persian copy for machine-like text
        run: npm run check:copy

  verdaccio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/verdaccio
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/verdaccio/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: ./node_modules/.bin/verdaccio --version

  pglite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/pglite
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/pglite/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: ./node_modules/.bin/pglite-server --help

  lockfile-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Reject npm lockfile URLs from unapproved hosts
        run: python scripts/check_lockfile_hosts.py

  pglite-database:
    runs-on: ubuntu-latest
    env:
      MRK_PGLITE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/pglite/package-lock.json
      - run: python -m pip install -e "./apps/control-plane[dev]"
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/pglite
      - name: Start PGlite for the smoke test
        run: bash scripts/ci_pglite_server.sh start "$RUNNER_TEMP/pglite/smoke"
      - name: Smoke test auth, tasks, backup and restore on PGlite
        env:
          MRK_SMOKE_DATABASE_URL: ${{ env.MRK_PGLITE_URL }}
        run: python scripts/smoke_pglite.py
      - name: Stop PGlite after the smoke test
        if: always()
        continue-on-error: true
        run: bash scripts/ci_pglite_server.sh stop "$RUNNER_TEMP/pglite/smoke"
      - name: Start a fresh PGlite for the migration rehearsal
        run: bash scripts/ci_pglite_server.sh start "$RUNNER_TEMP/pglite/rehearsal"
      - name: Rehearse migrations against PGlite
        run: python scripts/rehearse_migrations.py --database-url "$MRK_PGLITE_URL"
      - if: always()
        continue-on-error: true
        run: bash scripts/ci_pglite_server.sh stop "$RUNNER_TEMP/pglite/rehearsal"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pglite-database-logs
          path: ${{ runner.temp }}/pglite/*.log
          if-no-files-found: ignore

  engine-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/verdaccio/package-lock.json
      - run: python -m pip install -e "./apps/control-plane[dev]"
      - run: python -m pip install -r deploy/appliance/requirements.txt
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: deploy/verdaccio
      - name: Exercise real npm and PyPI engines across restart and offline download
        run: python scripts/e2e_local_engines.py
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-e2e-diagnostics
          path: .tmp/e2e-local-engines
          if-no-files-found: ignore

  dns-engine:
    runs-on: ubuntu-latest
    # Same pinned toolchain as the dns-builder stage of deploy/appliance/Dockerfile
    # (scripts/validate_release.py checks the digests match).
    container:
      image: golang:1.27.3-trixie@sha256:af1bfc2614ebb1dbd31af514b78740fd678850e76498762b425ecee4c5c6ea80
    defaults:
      run:
        working-directory: apps/dns-engine
    env:
      GOFLAGS: -buildvcs=false
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Unit, integration and race tests
        run: go test -race -count=1 ./...
      - name: Fuzz the parsers and message handling briefly (every Fuzz target of the module)
        run: |
          go test -run='^$' -fuzz='^FuzzParseQuery$' -fuzztime=20s ./internal/wire
          go test -run='^$' -fuzz='^FuzzTemplate$' -fuzztime=20s ./internal/wire
          go test -run='^$' -fuzz='^FuzzImport$' -fuzztime=20s ./internal/zone
          go test -run='^$' -fuzz='^FuzzHandle$' -fuzztime=20s ./internal/engine
          go test -run='^$' -fuzz='^FuzzZoneMessages$' -fuzztime=20s ./internal/engine
          go test -run='^$' -fuzz='^FuzzSegment$' -fuzztime=20s ./internal/querylog
          go test -run='^$' -fuzz='^FuzzParseFilter$' -fuzztime=20s ./internal/querylog
          go test -run='^$' -fuzz='^FuzzParseList$' -fuzztime=20s ./internal/filter
          go test -run='^$' -fuzz='^FuzzTransferParse$' -fuzztime=20s ./internal/xfr
          go test -run='^$' -fuzz='^FuzzTSIGCheck$' -fuzztime=20s ./internal/tsig
      - name: Known vulnerabilities in the module graph and the standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Static build smoke test
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/mrk-dns ./cmd/mrk-dns
          CGO_ENABLED=0 go build -trimpath -o /tmp/mrk-dnsbench ./cmd/mrk-dnsbench
          /tmp/mrk-dns version

  image-build:
    runs-on: ubuntu-latest
    needs: [control-plane, admin-ui, verdaccio, pglite, pglite-database, lockfile-hosts, engine-e2e, dns-engine]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate development compose file
        run: docker compose -f deploy/appliance/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/appliance/Dockerfile
          push: false
          load: true
          tags: mrk/package-mirror:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=ci
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint python mrk/package-mirror:ci -c "import mrk_control_plane"
      - name: DNS engine drops to uid 10001 keeping only NET_BIND_SERVICE
        run: |
          docker run --rm --entrypoint mrk-dns mrk/package-mirror:ci version
          docker run --detach --name mrk-ci-dns --init --user 0:10001 --read-only \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --env MRK_DNS_LISTEN=127.0.0.1:53 \
            --tmpfs /var/lib/mrk-dns:uid=10001,gid=10001 --tmpfs /run/mrk-dns:uid=10001,gid=10001 \
            --entrypoint mrk-dns mrk/package-mirror:ci serve
          sleep 3
          docker logs mrk-ci-dns
          docker exec mrk-ci-dns mrk-dns health
          pid=$(docker exec mrk-ci-dns sh -c 'for p in /proc/[0-9]*; do [ "$(cat $p/comm)" = mrk-dns ] && [ "$(awk "/^Uid/{print \$2}" $p/status)" = 10001 ] && basename $p; done' | head -1)
          docker exec mrk-ci-dns grep -E '^(Uid|Gid|CapPrm|CapEff|CapInh|CapAmb):' /proc/$pid/status
          docker exec mrk-ci-dns grep -qE '^CapEff:\s+0000000000000400$' /proc/$pid/status
          docker exec mrk-ci-dns grep -qE '^CapPrm:\s+0000000000000400$' /proc/$pid/status
          docker rm --force mrk-ci-dns
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mrk/package-mirror:ci
          version: v0.76.1
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - run: docker volume create mrk-ci-data
      - run: docker network create mrk-ci-online
      - run: >-
          docker run --detach --name mrk-ci --network mrk-ci-online --read-only
          --env MRK_TRUSTED_HOSTS=mrk-ci,127.0.0.1,localhost
          --env MRK_LOG_LEVEL=WARNING
          --tmpfs /tmp:size=64m,mode=1777 --mount source=mrk-ci-data,target=/data
          mrk/package-mirror:ci
      - run: >-
          docker exec --env MRK_HEALTHCHECK_ATTEMPTS=20 mrk-ci
          python -m mrk_control_plane.healthcheck
      - run: >-
          docker run --rm --network mrk-ci-online
          node:24.18.0-trixie-slim@sha256:ae91dcc111a68c9d2d81ff2a17bda61be126426176fde6fe7d08ab13b7f50573
          npm pack is-number@7.0.0 --registry http://mrk-ci:4873
      - run: >-
          docker run --rm --network mrk-ci-online
          python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          python -m pip download --no-deps --dest /tmp/pypi-online
          --index-url http://mrk-ci:3141/root/pypi/+simple/
          --trusted-host mrk-ci
          sampleproject==4.0.0
      - run: >-
          docker run --rm --network mrk-ci-online
          --mount type=bind,source=${{ github.workspace }}/tests/e2e/pypi-clients.sh,target=/test.sh,readonly
          python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          /bin/sh /test.sh
          http://mrk-ci:3141/root/pypi/+simple/ mrk-ci
      - name: Bounded control-plane load gate
        run: >-
          docker run --rm --network mrk-ci-online
          --mount type=bind,source=${{ github.workspace }}/scripts/load_probe.py,target=/load_probe.py,readonly
          python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          python /load_probe.py --url http://mrk-ci:8080/health/live
          --duration 20 --concurrency 8 --max-error-rate 0.001 --max-p95-ms 500
      - run: docker rm --force mrk-ci
      - run: docker network rm mrk-ci-online
      - run: docker network create --internal mrk-ci-offline
      - run: >-
          docker run --detach --name mrk-ci --network mrk-ci-offline --read-only
          --env MRK_TRUSTED_HOSTS=mrk-ci,127.0.0.1,localhost
          --env MRK_LOG_LEVEL=WARNING
          --tmpfs /tmp:size=64m,mode=1777 --mount source=mrk-ci-data,target=/data
          mrk/package-mirror:ci
      - run: >-
          docker exec --env MRK_HEALTHCHECK_ATTEMPTS=20 mrk-ci
          python -m mrk_control_plane.healthcheck
      - run: >-
          docker run --rm --network mrk-ci-offline
          node:24.18.0-trixie-slim@sha256:ae91dcc111a68c9d2d81ff2a17bda61be126426176fde6fe7d08ab13b7f50573
          npm pack is-number@7.0.0 --registry http://mrk-ci:4873
          --fetch-retries=0 --fetch-timeout=10000
      - run: >-
          docker run --rm --network mrk-ci-offline
          python:3.13-slim-trixie@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          python -m pip download --no-deps --dest /tmp/pypi-offline
          --index-url http://mrk-ci:3141/root/pypi/+simple/
          --trusted-host mrk-ci --retries 0 --timeout 10 sampleproject==4.0.0
      # mrk-ci publishes no host ports, so the compose stack (127.0.0.1:8080/4873/3141)
      # can start alongside it; the always() steps below clean both up.
      - name: Start development compose stack from the CI image
        run: |
          docker tag mrk/package-mirror:ci mrk/package-mirror:dev
          docker compose -f compose.yaml up --detach --no-build --wait --wait-timeout 240
      - name: Probe development compose stack
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8080/health/live
      - if: always()
        continue-on-error: true
        run: docker compose -f compose.yaml logs --no-color
      - if: always()
        continue-on-error: true
        run: docker compose -f compose.yaml down --volumes --remove-orphans
      - if: always()
        continue-on-error: true
        run: docker logs mrk-ci
      - if: always()
        continue-on-error: true
        run: docker rm --force mrk-ci
      - if: always()
        continue-on-error: true
        run: docker network rm mrk-ci-online
      - if: always()
        continue-on-error: true
        run: docker network rm mrk-ci-offline
      - if: always()
        continue-on-error: true
        run: docker volume rm mrk-ci-data

  # docs/44: the split images. The panel must boot alone, and the agent must pair
  # with the key the panel's wizard put in its .env.
  split-images:
    runs-on: ubuntu-latest
    needs: [control-plane, admin-ui, pglite, dns-engine]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate the panel compose file
        run: docker compose -f compose.yaml config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build every split image
        run: |
          for target in panel agent firewall dns s3; do
            docker buildx build --load --file deploy/images/Dockerfile --target "$target" \
              --build-arg VCS_REF=${{ github.sha }} --build-arg BUILD_DATE=ci --build-arg IMAGE_TAG=ci \
              --cache-from type=gha --cache-to type=gha,mode=max \
              --tag "mrk-$target:ci" .
          done
      - run: docker run --rm --entrypoint mrk-dns mrk-dns:ci version
      - run: docker run --rm --entrypoint python mrk-agent:ci -c "import mrk_control_plane.agent.main"
      - run: docker run --rm --entrypoint nft mrk-firewall:ci --version
      - name: The panel starts alone and reports ready
        run: |
          docker network create mrk-net-ci
          docker run --detach --name mrk-panel-ci --network mrk-net-ci --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env MRK_TRUSTED_HOSTS=mrk-panel-ci,127.0.0.1,localhost --env MRK_LOG_LEVEL=WARNING \
            --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev \
            --mount source=mrk-panel-ci-data,target=/data mrk-panel:ci
          docker exec --env MRK_HEALTHCHECK_ATTEMPTS=60 mrk-panel-ci python -m mrk_control_plane.healthcheck
          docker exec mrk-panel-ci python -c "import os; assert os.environ['MRK_IMAGE_TAG'] == 'ci'"
      - name: Panel logs
        if: always()
        continue-on-error: true
        run: docker logs mrk-panel-ci
      - name: Remove the panel
        if: always()
        continue-on-error: true
        run: |
          docker rm --force mrk-panel-ci || true
          docker network rm mrk-net-ci || true
          docker volume rm mrk-panel-ci-data || true
