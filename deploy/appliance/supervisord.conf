[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
strip_ansi=true

[unix_http_server]
file=/tmp/mrk-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/mrk-supervisor.sock

[program:pglite]
command=/opt/pglite/node_modules/.bin/pglite-server --db=/data/database/pglite --port=5433 --host=127.0.0.1 --max-connections=1
priority=5
autostart=true
autorestart=unexpected
startsecs=3
startretries=8
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
environment=HOME="/tmp",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:verdaccio]
command=python -m mrk_control_plane.verdaccio_runtime
priority=10
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
environment=HOME="/tmp",XDG_CONFIG_HOME="/data/npm/config",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:control-plane]
command=/usr/local/bin/mrk-control-plane
priority=30
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:devpi]
command=/bin/sh /opt/mrk/devpi-start.sh
priority=15
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:devpi-configure]
command=/bin/sh /opt/mrk/devpi-configure.sh
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pypi-router]
command=/usr/local/bin/mrk-pypi-router
priority=12
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
