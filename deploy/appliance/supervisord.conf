[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
strip_ansi=true

[unix_http_server]
file=/tmp/mrk-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/mrk-supervisor.sock

; Shutdown budget: supervisord stops priority groups one after another, highest
; priority first, waiting for each. Worst case: control-plane 10 + devpi-configure 5
; + devpi 15 + pypi-router 5 + verdaccio 10 + s3-engine 10 = 55s before PGlite (stopped
; last, 60s) and the listener (10s): 125s. Keep the container stop timeout >= 180s
; (stop_grace_period in Compose, --stop-timeout for docker run).
;
; Restart policy: the fatal-exit listener makes supervisord exit with status 0,
; so the container needs restart "unless-stopped"/"always" (Swarm: condition any),
; not "on-failure".

[program:pglite]
command=/opt/pglite/node_modules/.bin/pglite-server --db=/data/database/pglite --port=5433 --host=127.0.0.1 --max-connections=1
priority=5
autostart=true
autorestart=true
startsecs=3
startretries=8
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=HOME="/tmp",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Native S3-compatible object storage engine (Gate 18, docs/30, docs/31 §2). No
; PGlite access: it reads the snapshot /data/modules/s3/config.json written by the
; control plane. S3 API on MRK_S3_LISTEN, admin API on loopback only. Other
; MRK_S3_* tunables (limits, fsync policy, link roots) come from the container env.
[program:s3-engine]
command=/usr/local/bin/mrk-s3-engine
priority=8
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
; The admin API is pinned to loopback here on purpose (not overridable from the env).
environment=HOME="/tmp",MRK_S3_ADMIN_LISTEN="127.0.0.1:9001"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:verdaccio]
command=python -m mrk_control_plane.verdaccio_runtime
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/tmp",XDG_CONFIG_HOME="/data/npm/config",NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=512"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:control-plane]
command=/usr/local/bin/mrk-control-plane
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:devpi]
command=/bin/sh /opt/mrk/devpi-start.sh
priority=15
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:devpi-configure]
command=/bin/sh /opt/mrk/devpi-configure.sh
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
stopwaitsecs=5
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pypi-router]
command=/usr/local/bin/mrk-pypi-router
priority=12
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; A program that exhausts its retries goes FATAL while supervisord keeps
; running. For the essential programs (database, panel) this listener stops
; supervisord so Docker's restart policy acts. npm/PyPI/S3 stay FATAL and the
; panel's service watchdog retries them with a growing delay and notifies, so a
; broken registry never takes the panel down in a restart loop.
; MRK_FATAL_ESSENTIAL="*" restores "any FATAL restarts the container".
[eventlistener:fatal-exit]
command=python -m mrk_control_plane.supervisor_listener
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
environment=HOME="/tmp",MRK_FATAL_IGNORE="devpi-configure"
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
