; Panel image (docs/44): the panel and its PyPI router. Every other service is
; its own image, added from the panel's add-service wizard.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
strip_ansi=true

[unix_http_server]
file=/tmp/mrk-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/mrk-supervisor.sock

; Shutdown budget: control-plane 10s, router 5s, listener 10s. PostgreSQL is
; its own service (mrk-db in compose.yaml; the host's PostgreSQL natively).

[program:control-plane]
command=/usr/local/bin/mrk-control-plane
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; PyPI upstream router (failover, proxies, quarantine). It stays with the panel
; because it reads the panel's upstreams and secrets; devpi in the mrk-pypi
; container uses it as its mirror over mrk-net (docs/44). Idle until PyPI is added.
[program:pypi-router]
command=/usr/local/bin/mrk-pypi-router
priority=12
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; The panel is essential: if it goes FATAL, stop
; supervisord so the container's restart policy acts (the router is not).
[eventlistener:fatal-exit]
command=python -m mrk_control_plane.supervisor_listener
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
environment=HOME="/tmp"
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
