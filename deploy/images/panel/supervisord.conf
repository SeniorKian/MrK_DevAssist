; Panel image (docs/44): only the database and the panel. Every other service is
; its own image, added from the panel's add-service wizard.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
strip_ansi=true

[unix_http_server]
file=/tmp/mrk-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/mrk-supervisor.sock

; Shutdown budget: control-plane 10s, then PGlite (stopped last, 60s) and the
; listener (10s). Keep the container stop timeout >= 180s like the appliance.

[program:pglite]
command=/opt/pglite/node_modules/.bin/pglite-server --db=/data/database/pglite --port=5433 --host=127.0.0.1 --max-connections=1
priority=5
autostart=true
autorestart=true
startsecs=3
startretries=8
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=HOME="/tmp",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:control-plane]
command=/usr/local/bin/mrk-control-plane
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; PyPI upstream router (failover, proxies, quarantine). It stays with the panel
; because it reads the panel's upstreams and secrets; devpi in the mrk-pypi
; container uses it as its mirror over mrk-net (docs/44). Idle until PyPI is added.
[program:pypi-router]
command=/usr/local/bin/mrk-pypi-router
priority=12
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; The database and the panel are essential: if either goes FATAL, stop
; supervisord so the container's restart policy acts (the router is not).
[eventlistener:fatal-exit]
command=python -m mrk_control_plane.supervisor_listener
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
environment=HOME="/tmp"
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
