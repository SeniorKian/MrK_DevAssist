[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mrk-control-plane"
version = "0.3.1"
description = "Control plane of MrK DevAssist, a self-hosted server and DevOps assistant"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "fastapi==0.162.2",
  # [socks]: SOCKS5/SOCKS5h outbound proxies (socksio, MIT); pinned below as well.
  "httpx[socks]==0.28.1",
  "socksio==1.0.0",
  "uvicorn[standard]==0.54.0",
  # S3 engine: hardware CRC32C/CRC64NVME checksums (Apache-2.0; abi3 wheels for
  # linux amd64/arm64). A slow pure-Python fallback exists if it is missing.
  "awscrt==0.38.1",
  # Database admin module (Gate 19 S9) drivers; PostgreSQL uses psycopg above.
  "PyMySQL==1.2.3",  # MIT, pure Python (MySQL/MariaDB)
  "pymongo==4.19.0",  # Apache-2.0
  "dnspython==2.9.2",  # ISC, required by pymongo
  "redis==8.1.0",  # MIT
  # htpasswd of the Docker image registry (Zot accepts only bcrypt); Apache-2.0.
  "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "httpx2==2.16.0",
  # S3 engine end-to-end tests only (real SDK client against the engine).
  "boto3==1.43.126",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[project.scripts]
mrk-control-plane = "mrk_control_plane.main:run"
mrk-pypi-router = "mrk_control_plane.pypi_router:run"
mrk-devpi-server = "mrk_control_plane.devpi_quota:run"
mrk-restore = "mrk_control_plane.restore:run"
mrk-agent = "mrk_control_plane.agent.main:run"
mrk-s3-engine = "mrk_control_plane.s3engine.main:run"
mrk-backup-decrypt = "mrk_control_plane.modules.server_backups_crypto:run"
mrk-firewall = "mrk_control_plane.firewall.main:run"
mrk-npm-runner = "mrk_control_plane.npm_runner:run"
mrk-db-secret = "mrk_control_plane.db_secret:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mrk_control_plane"]
