services:
  mrk-mirror:
    build:
      context: .
      dockerfile: deploy/appliance/Dockerfile
      args:
        NPM_REGISTRY: ${MRK_BUILD_NPM_REGISTRY:-}
        PIP_INDEX_URL: ${MRK_BUILD_PIP_INDEX_URL:-}
    image: mrk/package-mirror:dev
    restart: unless-stopped
    # Run as the image's unprivileged user; with cap_drop ALL the root bootstrap
    # path cannot chown or drop privileges and the container would crash-loop.
    user: "10001:10001"
    environment:
      MRK_ENV: development
      MRK_DATA_DIR: /data
      MRK_UPSTREAM_SECRET_KEY_FILE: ${MRK_UPSTREAM_SECRET_KEY_FILE:-}
      # Host Agent pairing from the environment (optional; both must be set, and the
      # key file must be mounted into this container). Otherwise pair in the Admin UI.
      MRK_AGENT_URL: ${MRK_AGENT_URL:-}
      MRK_AGENT_KEY_FILE: ${MRK_AGENT_KEY_FILE:-}
      # Firewall helper pairing from the environment (optional, like the agent).
      MRK_FIREWALL_URL: ${MRK_FIREWALL_URL:-}
      MRK_FIREWALL_KEY_FILE: ${MRK_FIREWALL_KEY_FILE:-}
      MRK_LOG_LEVEL: INFO
      MRK_CORS_ORIGINS: http://localhost:8080
      MRK_TRUSTED_HOSTS: localhost,127.0.0.1
      MRK_ADMIN_UI_DIR: /opt/mrk/admin-ui
      MRK_NPM_ENABLED: "true"
      MRK_NPM_HEALTH_PORT: "4873"
    volumes:
      # Named volume by default (Docker copies the image's 10001-owned /data into it).
      # Set MRK_HOST_DATA_PATH to a host directory owned by 10001:10001 to bind-mount.
      - ${MRK_HOST_DATA_PATH:-mrk-dev-data}:/data
      # Optional: linked-folder S3 buckets (docs/30 §3.2). Mount host folders under
      # /mnt/links (readable/writable by UID 10001; add :ro for read-only buckets),
      # then link them in the panel. One parent mount lets you add folders without
      # recreating the container.
      # - /srv/files:/mnt/links/files
      # Unix socket of the optional mrk-firewall helper (Gate 19 S7). Read-only is
      # enough to connect; the volume stays empty unless the `firewall` profile runs.
      - mrk-firewall-run:/run/mrk-firewall:ro
      # Admin socket and token of the optional MRK DNS engine (docs/37). Read-only is
      # enough to connect; the volume stays empty unless the `dns` profile runs.
      - mrk-dns-run:/run/mrk-dns:ro
    ports:
      - "127.0.0.1:${MRK_ADMIN_PORT:-8080}:8080"
      - "127.0.0.1:${MRK_NPM_PORT:-4873}:4873"
      - "127.0.0.1:${MRK_PYPI_PORT:-3141}:3141"
      # Native S3 API (s3-engine). Route s3.<domain> (and *.s3.<domain> for
      # virtual-hosted style) here with the original Host header preserved.
      - "127.0.0.1:${MRK_S3_PORT:-9000}:9000"
    networks:
      - default
      - mrk-agent
      # Domains without a Dokploy Compose install (docs/35, mode traefik_file):
      # join Dokploy's network so its Traefik can reach this container, and
      # uncomment `dokploy-network` under the top-level networks too.
      # - dokploy-network
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Same ceilings as deploy/appliance/compose.production.yaml.
    mem_limit: ${MRK_MEM_LIMIT:-2g}
    memswap_limit: ${MRK_MEM_LIMIT:-2g}
    cpus: ${MRK_CPUS:-2.0}
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # PGlite is stopped last by Supervisor (worst case ~115s, see supervisord.conf).
    stop_grace_period: 180s
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - mrk_control_plane.healthcheck
      interval: 30s
      timeout: 8s
      retries: 3
      # First boot (PGlite initdb, devpi-init, migrations) can take minutes.
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional native Host Agent (Gate 16, read-only). Not started unless you run
  # `docker compose --profile agent up -d`. Same image, different entrypoint.
  # SECURITY: access to the Docker socket is equivalent to root on the host. The
  # agent only issues the calls on its in-code allowlist (reads, start/stop/restart,
  # pull, prune of non-Dokploy items, fixed-argv DB dumps), only
  # answers HMAC-signed requests, and has NO published ports (private network only).
  mrk-agent:
    image: mrk/package-mirror:dev
    profiles: ["agent"]
    entrypoint: ["mrk-agent"]
    restart: unless-stopped
    # Default "0:0" with every capability dropped except DAC_READ_SEARCH/
    # DAC_OVERRIDE: Docker keeps volume data in root-only directories, so this is
    # what lets server backups read volumes. All host mounts stay read-only and the
    # Docker socket already equals host root. Set MRK_AGENT_USER="10001:<docker gid>"
    # to run fully unprivileged (volume backups are then unavailable).
    user: "${MRK_AGENT_USER:-0:0}"
    group_add:
      - "${MRK_DOCKER_GID:-999}"
    environment:
      MRK_LOG_LEVEL: ${MRK_LOG_LEVEL:-INFO}
      MRK_AGENT_LISTEN: 0.0.0.0:7070
      MRK_AGENT_STATE_DIR: /data/agent
      MRK_AGENT_DOCKER_SOCKET: /var/run/docker.sock
      MRK_AGENT_HOST_PROC: /host/proc
      # Read-only cgroup v2 tree for per-container CPU/memory/IO counters (Gate 17).
      MRK_AGENT_HOST_CGROUP: /host/cgroup
      # Read-only Docker volumes tree for server backups (Gate 18 S6).
      MRK_AGENT_HOST_VOLUMES: /host/volumes
      # Containers matching these are reported as protected (Dokploy is never touched).
      MRK_AGENT_PROTECTED_NAME_REGEX: ${MRK_AGENT_PROTECTED_NAME_REGEX:-}
      # Opt-in (docs/35, domains mode traefik_file): the folder below where the
      # agent may write ONLY mrk-domains.yml. Leave empty to keep it disabled.
      MRK_AGENT_TRAEFIK_DYNAMIC_DIR: ${MRK_AGENT_TRAEFIK_DYNAMIC_DIR:-}
    volumes:
      # Agent state (pairing key, mode 0600). Docker seeds the new volume from the
      # image's 10001-owned /data, so the unprivileged user can write it.
      - mrk-agent-state:/data
      # `:ro` would NOT restrict the Docker API; the in-code allowlist does.
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      # Gate 18 server backups: volumes are archived from here, read-only (needs
      # the default root user + DAC capabilities above). Remove this line to
      # disable volume backups; database dumps do not need it.
      - /var/lib/docker/volumes:/host/volumes:ro
      # Optional: host root, read-only, used only for statvfs disk usage and the
      # host name. Remove this line to hide the host filesystem from the agent; disk
      # usage then falls back to the container's own root filesystem.
      - /:/host/root:ro
      # Opt-in, the only read-write host mount (docs/35): Dokploy's Traefik
      # dynamic-config folder. Set MRK_AGENT_TRAEFIK_DYNAMIC_DIR=/host/traefik-dynamic
      # and enable "Allow the Traefik file" in the panel. The agent writes only
      # /host/traefik-dynamic/mrk-domains.yml (never acme.json or other files).
      # - /etc/dokploy/traefik/dynamic:/host/traefik-dynamic
    networks:
      - mrk-agent
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7070/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional native firewall helper (Gate 19 S7). Not started unless you run
  # `docker compose --profile firewall up -d mrk-firewall`. Same image.
  # SECURITY: root with ONLY CAP_NET_ADMIN (Docker grants added capabilities to
  # root only; nftables needs netlink with NET_ADMIN), in the host network
  # namespace (nftables rules are per namespace), read-only root fs and read-only
  # log mounts. It manages exactly one nftables table, `inet mrk` (hook prerouting,
  # priority raw), and never touches Docker/Dokploy chains. NO ports: it listens on
  # a Unix socket in the `mrk-firewall-run` volume, which only mrk-mirror mounts,
  # and every request must be HMAC-signed with its own pairing key. Dry-run is the
  # default; enforcing needs the typed confirmation "ENFORCE" in the panel.
  mrk-firewall:
    image: mrk/package-mirror:dev
    profiles: ["firewall"]
    entrypoint: ["mrk-firewall"]
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    environment:
      MRK_LOG_LEVEL: ${MRK_LOG_LEVEL:-INFO}
      MRK_FIREWALL_LISTEN: unix:/run/mrk-firewall/firewall.sock
      MRK_FIREWALL_STATE_DIR: /var/lib/mrk-firewall
      MRK_FIREWALL_LOG_ROOT: /host/log
      # true = never install rules, whatever the panel says (emergency brake).
      MRK_FIREWALL_FORCE_DRY_RUN: ${MRK_FIREWALL_FORCE_DRY_RUN:-false}
    volumes:
      # Pairing key (firewall.key, mode 0600) and the last applied desired state,
      # re-applied on start so blocks survive a restart.
      - mrk-firewall-state:/var/lib/mrk-firewall
      - mrk-firewall-run:/run/mrk-firewall
      # Read-only log sources. Only parsed signals (ip, kind, short detail) ever
      # leave the helper, never raw lines. /var/log/auth.log -> sshd source
      # /host/log/system/auth.log (journald-only hosts: see deploy/appliance/README.md).
      - /var/log:/host/log/system:ro
      # Optional Traefik (Dokploy) access log, JSON or common format; set the same
      # path (/host/log/traefik/access.log) in the panel and enable the source.
      # - /etc/dokploy/traefik/dynamic/access.log:/host/log/traefik/access.log:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; httpx.Client(transport=httpx.HTTPTransport(uds='/run/mrk-firewall/firewall.sock'), timeout=3).get('http://mrk-firewall/v1/health').raise_for_status()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional MRK DNS engine (docs/36, docs/37). Not started unless you run
  # `docker compose --profile dns up -d mrk-dns`. Same image, its own container so
  # the cgroup limits below protect the panel, npm, PyPI and the host under a DNS
  # flood, and a panel restart never interrupts DNS.
  # SECURITY: host network (docker-proxy is slow for UDP and hides the real client
  # address that ACLs and rate limits need), read-only root fs, no published ports.
  # It starts as uid 0 with ONLY NET_BIND_SERVICE, SETUID and SETGID (no file
  # capabilities: no-new-privileges ignores them) and, before doing anything else,
  # drops to MRK_DNS_RUN_AS (10001, the panel's uid) on every thread keeping only
  # NET_BIND_SERVICE; SETUID/SETGID cannot come back (no-new-privileges). It binds only the addresses in its
  # settings (first start: MRK_DNS_LISTEN); recursion is limited to private
  # networks and is never offered to the Internet. The admin API is a Unix socket
  # in `mrk-dns-run` (mode 0660, bearer token file 0640), shared only with mrk-mirror.
  mrk-dns:
    image: mrk/package-mirror:dev
    profiles: ["dns"]
    entrypoint: ["mrk-dns"]
    command: ["serve"]
    restart: unless-stopped
    # Root only for the instant before the engine drops to MRK_DNS_RUN_AS; gid 10001
    # lets `mrk-dns health` (docker exec) reach the 0660 admin socket.
    user: "0:10001"
    network_mode: host
    environment:
      # Unprivileged identity the engine switches to (must match mrk-mirror's user).
      MRK_DNS_RUN_AS: ${MRK_DNS_RUN_AS:-10001:10001}
      MRK_DNS_DATA_DIR: /var/lib/mrk-dns
      MRK_DNS_ADMIN_SOCKET: /run/mrk-dns/admin.sock
      MRK_DNS_ADMIN_TOKEN_FILE: /run/mrk-dns/admin.token
      # First start only; afterwards the listen addresses come from the DNS settings.
      MRK_DNS_LISTEN: ${MRK_DNS_LISTEN:-127.0.0.1:53,172.17.0.1:53}
      # Empty = 85% of the container memory limit.
      MRK_DNS_GOMEMLIMIT: ${MRK_DNS_GOMEMLIMIT:-}
      MRK_DNS_LOG_LEVEL: ${MRK_DNS_LOG_LEVEL:-info}
    volumes:
      # Settings, zones (with 50-version history) and overrides; atomic writes.
      - mrk-dns-data:/var/lib/mrk-dns
      # Admin socket + token; also mounted read-only into mrk-mirror.
      - mrk-dns-run:/run/mrk-dns
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    cpus: ${MRK_DNS_CPUS:-2}
    mem_limit: ${MRK_DNS_MEMORY:-512m}
    memswap_limit: ${MRK_DNS_MEMORY:-512m}
    pids_limit: ${MRK_DNS_PIDS:-256}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "mrk-dns", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mrk-dev-data:
  mrk-agent-state:
  mrk-firewall-state:
  mrk-firewall-run:
  mrk-dns-data:
  mrk-dns-run:

networks:
  # Internal-only network between mrk-mirror and the optional mrk-agent; no egress.
  mrk-agent:
    internal: true
  # Uncomment together with `- dokploy-network` on mrk-mirror (docs/35).
  # dokploy-network:
  #   external: true
