# MrK DevAssist - the panel (docs/44). Step 1 of every install.
#
# This stack runs ONLY the admin panel and its PostgreSQL database. Open it, create
# the owner account, then add the services you want (server agent, DNS, firewall,
# S3, npm, PyPI) from «My services -> Add a service»: the wizard gives a
# ready Compose file and .env for each one, for Dokploy, Coolify or docker compose.
#
#   docker compose up -d                 # published image (MRK_PANEL_IMAGE)
#   docker compose up -d --build         # or build it from this checkout
#
# Dokploy: Create Compose -> Compose Path ./compose.yaml.
# Coolify: New resource -> Docker Compose -> this file.
# The stack also creates the shared pieces the service stacks attach to: the
# internal network mrk-net and the volumes mrk-dns-run, mrk-firewall-run,
# mrk-npm-data, mrk-pypi-data and mrk-registry-config.
services:
  # One-shot: creates the database password once, in a volume only mrk-db and the
  # panel mount. No password lives in .env; restarts keep the same one.
  mrk-db-init:
    image: ${MRK_PANEL_IMAGE:-ghcr.io/seniorkian/mrk-panel:0.2.0}
    build: &panel-build
      context: .
      dockerfile: deploy/images/Dockerfile
      target: panel
      args:
        NPM_REGISTRY: ${MRK_BUILD_NPM_REGISTRY:-}
        PIP_INDEX_URL: ${MRK_BUILD_PIP_INDEX_URL:-}
        GOPROXY: ${MRK_BUILD_GOPROXY:-}
        APT_MIRROR: ${MRK_BUILD_APT_MIRROR:-}
    entrypoint: ["mrk-db-secret", "/run/mrk-db/password"]
    restart: "no"
    user: "10001:10001"
    volumes:
      - mrk-db-secret:/run/mrk-db
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # PostgreSQL for the panel. Its data is the volume mrk-db-data (or a host folder,
  # MRK_HOST_DB_PATH). Reachable only by the panel, on the internal mrk-db-net.
  mrk-db:
    image: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    depends_on:
      mrk-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: devassist
      POSTGRES_DB: devassist
      POSTGRES_PASSWORD_FILE: /run/mrk-db/password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${MRK_HOST_DB_PATH:-mrk-db-data}:/var/lib/postgresql/data
      - mrk-db-secret:/run/mrk-db:ro
    networks:
      - mrk-db-net
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=8m,uid=999,gid=999,mode=2775
    security_opt:
      - no-new-privileges:true
    # The image's entrypoint fixes data-folder ownership, then drops to uid 999.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: ${MRK_DB_MEMORY:-1g}
    memswap_limit: ${MRK_DB_MEMORY:-1g}
    cpus: ${MRK_DB_CPUS:-1.0}
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devassist -d devassist -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mrk-panel:
    image: ${MRK_PANEL_IMAGE:-ghcr.io/seniorkian/mrk-panel:0.2.0}
    build: *panel-build
    restart: unless-stopped
    depends_on:
      mrk-db:
        condition: service_healthy
    # The image's unprivileged user; with cap_drop ALL a root start could not chown.
    user: "10001:10001"
    environment:
      # PostgreSQL (mrk-db). The password is read from the generated file.
      MRK_DATABASE_URL: postgresql+psycopg://devassist@mrk-db:5432/devassist?sslmode=disable
      MRK_DATABASE_PASSWORD_FILE: /run/mrk-db/password
      MRK_LOG_LEVEL: ${MRK_LOG_LEVEL:-INFO}
      MRK_UPSTREAM_SECRET_KEY_FILE: ${MRK_UPSTREAM_SECRET_KEY_FILE:-}
      # Host names the panel answers to. Domains added in the panel are trusted
      # automatically; add the server IP here only for direct http://<ip>:8080 access.
      MRK_TRUSTED_HOSTS: ${MRK_TRUSTED_HOSTS:-localhost,127.0.0.1}
      MRK_CORS_ORIGINS: ${MRK_CORS_ORIGINS:-http://localhost:8080}
      # Where the wizard points service images (default: this project's GHCR).
      MRK_IMAGE_REGISTRY: ${MRK_IMAGE_REGISTRY:-}
    volumes:
      # Named volume by default. Set MRK_HOST_DATA_PATH to a host directory owned by
      # 10001:10001 to bind-mount instead.
      - ${MRK_HOST_DATA_PATH:-mrk-panel-data}:/data
      - mrk-db-secret:/run/mrk-db:ro
      # Admin socket of the DNS service and the firewall helper's socket, once added.
      - mrk-dns-run:/run/mrk-dns:ro
      - mrk-firewall-run:/run/mrk-firewall:ro
      # Data of the npm and PyPI services, once added: the panel writes their
      # config (users, upstreams, quotas) and browses their packages here.
      - mrk-npm-data:/data/npm
      - mrk-pypi-data:/data/pypi
      # Config and users of the Docker image registry (Zot reloads them), once added.
      - mrk-registry-config:/data/registry
    ports:
      # Loopback by default. MRK_ADMIN_BIND=0.0.0.0 publishes the panel on every
      # interface over plain HTTP: do that only temporarily and firewall the port.
      - "${MRK_ADMIN_BIND:-127.0.0.1}:${MRK_ADMIN_PORT:-8080}:8080"
    networks:
      default:
      mrk-db-net:
      mrk-net:
        # devpi (mrk-pypi) reaches the panel's PyPI router as http://mrk-panel:3142.
        aliases: [mrk-panel]
      # Behind Dokploy's Traefik without its own domain settings: join Dokploy's
      # network and uncomment it under the top-level networks too.
      # dokploy-network:
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${MRK_MEM_LIMIT:-2g}
    memswap_limit: ${MRK_MEM_LIMIT:-2g}
    cpus: ${MRK_CPUS:-1.0}
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "mrk_control_plane.healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      # First boot (migrations) can take a minute.
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mrk-panel-data:
  # The panel's PostgreSQL data, and the generated database password.
  mrk-db-data:
  mrk-db-secret:
  # Fixed names: the DNS and firewall stacks (added later) attach to these.
  mrk-dns-run:
    name: mrk-dns-run
  mrk-firewall-run:
    name: mrk-firewall-run
  mrk-npm-data:
    name: mrk-npm-data
  mrk-pypi-data:
    name: mrk-pypi-data
  mrk-registry-config:
    name: mrk-registry-config

networks:
  # Panel <-> PostgreSQL only; no egress.
  mrk-db-net:
    internal: true
  # Internal, no egress: the panel talks to the service stacks here
  # (e.g. http://mrk-agent:7070). Fixed name so other stacks can join it.
  mrk-net:
    name: mrk-net
    internal: true
  # dokploy-network:
  #   external: true
