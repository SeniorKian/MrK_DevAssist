# Same stack as compose.yaml, with npm, PyPI and S3 each on its own host directory
# (for example three different disks). Use this file INSTEAD of compose.yaml
# (Dokploy: Compose Path = ./compose.split-storage.yaml):
#
#   docker compose -f compose.split-storage.yaml up -d --build
#
#   MRK_HOST_NPM_PATH   npm cache and private packages        -> /data/npm
#   MRK_HOST_PYPI_PATH  PyPI mirror and private packages      -> /data/pypi
#   MRK_HOST_S3_PATH    S3 objects, metadata and engine files -> /data/modules/s3
#
# Everything else (database, panel state, backups, logs) stays on the /data mount of
# compose.yaml: the named volume "mrk-dev-data", or MRK_HOST_DATA_PATH. The DNS engine
# data is set with MRK_HOST_DNS_PATH in either file.
#
# Every host directory must already exist and be owned by 10001:10001; the container
# runs unprivileged and cannot chown:
#
#   sudo install -d -o 10001 -g 10001 -m 0750 /storage/npm /storage/pypi /storage/s3
#
# If MRK_HOST_DATA_PATH is set too, also create <MRK_HOST_DATA_PATH>/modules with the
# same owner, or Docker creates that mount point as root.
#
# What separate mounts cost (a rename cannot cross a mount point):
# - Purging an npm package to the recycle bin, and restoring it, copies the package
#   instead of renaming it. Slower for big packages, otherwise the same.
# - The offline restore (`mrk-restore apply`) refuses the npm and pypi data roots,
#   because it swaps whole directories with a rename. Backups are still created and
#   validated normally. To restore npm or PyPI data, run the restore with compose.yaml
#   (one /data mount) and copy the folders back to their own directories afterwards.
services:
  mrk-mirror:
    extends:
      file: compose.yaml
      service: mrk-mirror
    volumes:
      - ${MRK_HOST_NPM_PATH:?Set MRK_HOST_NPM_PATH to a host directory owned by 10001:10001}:/data/npm
      - ${MRK_HOST_PYPI_PATH:?Set MRK_HOST_PYPI_PATH to a host directory owned by 10001:10001}:/data/pypi
      - ${MRK_HOST_S3_PATH:?Set MRK_HOST_S3_PATH to a host directory owned by 10001:10001}:/data/modules/s3

  mrk-agent:
    extends:
      file: compose.yaml
      service: mrk-agent

  mrk-firewall:
    extends:
      file: compose.yaml
      service: mrk-firewall

  mrk-dns:
    extends:
      file: compose.yaml
      service: mrk-dns

volumes:
  mrk-dev-data:
  mrk-agent-state:
  mrk-firewall-state:
  mrk-firewall-run:
  mrk-dns-data:
  mrk-dns-run:

networks:
  # Internal-only network between mrk-mirror and the optional mrk-agent; no egress.
  mrk-agent:
    internal: true
